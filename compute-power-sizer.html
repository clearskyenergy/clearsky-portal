<script>

  'use strict';

  var TOOL_KEY = 'computepower';   /* must match the registry `key` */

  var ret = (window.location.search.match(/[?&]return=([^&]+)/) || [])[1];
  if (ret) {
    try {
      var href = decodeURIComponent(ret);
      if (/^https?:\/\//i.test(href)) {

        a.id = 'omega-back'; a.href = href; a.textContent = '\u2190 Portal';
        document.body.appendChild(a);

  var badge = document.getElementById('omega-save');
  function flash(msg) {

    setTimeout(function () { badge.style.opacity = '0'; }, 1800);

  function mount(saved) {
    if (typeof window.__omegaBoot === 'function') window.__omegaBoot(saved || null);

  var hasFb = typeof firebase !== 'undefined' && firebase.firestore;

  if (!firebase.apps.length) firebase.initializeApp(cfg);
  var db = firebase.firestore();
  var booted = false;
